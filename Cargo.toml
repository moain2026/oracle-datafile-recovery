[workspace]
resolver = "3"
members = ["crates/odr-core", "crates/odr-testkit", "crates/odr-cli", "crates/odr-corrupt"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
repository = "https://github.com/moain2026/oracle-datafile-recovery"
authors = ["moain2026"]

[workspace.dependencies]
odr-core = { path = "crates/odr-core", version = "0.1.0" }
odr-testkit = { path = "crates/odr-testkit", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false

[profile.bench]
inherits = "release"
debug = true
strip = "none"

# Property tests run 80k+ cases; optimise dev builds of tests a little.
[profile.dev]
opt-level = 1
